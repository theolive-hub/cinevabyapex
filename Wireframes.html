<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cineva — Homepage Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  body { margin: 0; background: #f5f4f1; }
  * { box-sizing: border-box; }
</style>
<script type="text/babel">

/* ============================================================
   Brand tokens — lifted exactly from the brief
   ============================================================ */
const T = {
  /* Colors — neutrals */
  ink:      '#1C1D20',
  inkSoft:  '#1F2025',
  carbon:   '#292A2F',
  smoke:    '#383A40',
  steel:    '#4F525A',
  iron:     '#6B6E78',
  fog:      '#9598A2',
  mist:     '#C5C8D0',
  bone:     '#DDDFE5',
  signal:   '#E5E8EC',
  white:    '#FFFFFF',
  /* Colors — brand accents */
  cyan:     '#38B6D9',
  cyanDeep: '#267E99',
  cyanSoft: '#0D2A33',
  stage:    '#C9337A',
  stageDeep:'#962257',
  /* Hairlines */
  line1:    'rgba(255,255,255,0.06)',
  line2:    'rgba(255,255,255,0.10)',
  line3:    'rgba(255,255,255,0.18)',
  /* Fonts */
  archivo:  '"Archivo", "Helvetica Neue", Arial, sans-serif',
  mono:     '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace',
};

/* ============================================================
   Eyebrow pattern — brand signature
   01 ──── LABEL
   Number in cyan mono, hairline rule, label in Archivo 700
   tracking 0.24em, UPPERCASE
   ============================================================ */
function Eyebrow({ num, children }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:12 }}>
      {num && <span style={{
        fontFamily: T.mono,
        fontWeight: 500,
        fontSize: 13,
        letterSpacing: '0.08em',
        color: T.cyan,
      }}>{num}</span>}
      {num && <span style={{
        display:'inline-block',
        width: 16,
        height: 1,
        background: T.fog,
      }}></span>}
      <span style={{
        fontFamily: T.archivo,
        fontWeight: 700,
        fontSize: 13,
        letterSpacing: '0.24em',
        textTransform: 'uppercase',
        color: T.fog,
      }}>{children}</span>
    </div>
  );
}

/* Display heading — Archivo 900, -0.02em, lh 0.95 */
function Display({ children, size=52, style={} }) {
  return (
    <div style={{
      fontFamily: T.archivo,
      fontWeight: 900,
      fontSize: size,
      lineHeight: 0.95,
      letterSpacing: '-0.02em',
      color: T.bone,
      ...style,
    }}>{children}</div>
  );
}

/* Body — Archivo 400/500, lh 1.55 */
function Body({ children, size=16, color, style={} }) {
  return (
    <div style={{
      fontFamily: T.archivo,
      fontWeight: 400,
      fontSize: size,
      lineHeight: 1.55,
      color: color || T.mist,
      textWrap: 'pretty',
      ...style,
    }}>{children}</div>
  );
}

/* Mono label — JetBrains Mono 500, +0.08em, UPPERCASE */
function Mono({ children, size=13, color, style={} }) {
  return (
    <span style={{
      fontFamily: T.mono,
      fontWeight: 500,
      fontSize: size,
      letterSpacing: '0.08em',
      textTransform: 'uppercase',
      color: color || T.fog,
      ...style,
    }}>{children}</span>
  );
}

/* CTA button — cyan filled */
function CyanBtn({ children, style={} }) {
  return (
    <div style={{
      display: 'inline-block',
      fontFamily: T.archivo,
      fontWeight: 600,
      fontSize: 14,
      padding: '14px 24px',
      background: T.cyan,
      color: T.ink,
      borderRadius: 2,
      lineHeight: 1,
      ...style,
    }}>{children}</div>
  );
}

/* Ghost button — transparent with border */
function GhostBtn({ children, style={} }) {
  return (
    <div style={{
      display: 'inline-block',
      fontFamily: T.archivo,
      fontWeight: 600,
      fontSize: 14,
      padding: '14px 24px',
      background: 'transparent',
      color: T.bone,
      border: `1px solid ${T.line3}`,
      borderRadius: 2,
      lineHeight: 1,
      ...style,
    }}>{children}</div>
  );
}

/* Image placeholder */
function ImageSlot({ label, height=200, style={} }) {
  return (
    <div style={{
      width:'100%', height,
      background: T.carbon,
      border: `1px dashed ${T.smoke}`,
      display:'flex', alignItems:'center', justifyContent:'center',
      ...style,
    }}>
      <Mono size={11} color={T.iron}>{label || 'IMAGE SLOT'}</Mono>
    </div>
  );
}

/* Annotation */
function Note({ children }) {
  return (
    <div style={{
      fontFamily: T.archivo,
      fontSize: 13,
      fontWeight: 600,
      color: T.stage,
      padding: '8px 12px',
      background: 'rgba(201,51,122,0.06)',
      borderLeft: `3px solid ${T.stage}`,
      marginTop: 16,
    }}>{children}</div>
  );
}

/* ============================================================
   Shared nav + footer (same across all directions)
   ============================================================ */
function Nav() {
  return (
    <div style={{
      padding: '0 24px',
      height: 72,
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between',
      background: T.ink,
      borderBottom: `1px solid ${T.line2}`,
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        {/* Aperture mark placeholder */}
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke={T.bone} strokeWidth="1.5">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2 L14 10" /><path d="M20 7 L13 12" /><path d="M20 17 L14 14" />
          <path d="M12 22 L10 14" /><path d="M4 17 L11 12" /><path d="M4 7 L10 10" />
        </svg>
        <div>
          <span style={{ fontFamily:T.archivo, fontWeight:800, fontSize:16, color:T.bone, letterSpacing:'-0.01em' }}>Cineva</span>
          <span style={{ fontFamily:T.archivo, fontWeight:400, fontSize:10, color:T.fog, marginLeft:6 }}>by Apex Sound & Light</span>
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:24 }}>
        {['Home','What We Do','About','Work'].map(l => (
          <span key={l} style={{ fontFamily:T.archivo, fontWeight:500, fontSize:13, color:T.mist, letterSpacing:'0.02em' }}>{l}</span>
        ))}
        <CyanBtn style={{ padding:'10px 18px', fontSize:13 }}>Contact</CyanBtn>
      </div>
    </div>
  );
}

function Footer() {
  return (
    <div style={{
      padding: '24px',
      background: T.carbon,
      borderTop: `1px solid ${T.line1}`,
      display: 'flex',
      justifyContent: 'space-between',
      alignItems: 'center',
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke={T.fog} strokeWidth="1.5">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2 L14 10" /><path d="M20 7 L13 12" /><path d="M20 17 L14 14" />
          <path d="M12 22 L10 14" /><path d="M4 17 L11 12" /><path d="M4 7 L10 10" />
        </svg>
        <Body size={13} color={T.fog}>Cineva · by Apex Sound & Light</Body>
      </div>
      <Mono size={11} color={T.iron}>© 2026 APEX SOUND & LIGHT · PICKERING, ON</Mono>
    </div>
  );
}

/* Trusted-by row */
function TrustedBy() {
  return (
    <div style={{
      padding: '40px 24px',
      background: T.ink,
      borderTop: `1px solid ${T.line1}`,
      display: 'flex',
      justifyContent: 'center',
      gap: 40,
      flexWrap: 'wrap',
    }}>
      {['HBO','NETFLIX','CBC','FOX SPORTS','BELL MEDIA','AMAZON STUDIOS'].map(s => (
        <Mono key={s} size={11} color={T.iron}>{s}</Mono>
      ))}
    </div>
  );
}

/* CTA band */
function CTABand() {
  return (
    <div style={{
      padding: '64px 24px',
      background: T.ink,
      borderTop: `1px solid ${T.line1}`,
      textAlign: 'center',
    }}>
      <Display size={36} style={{ color:T.bone, display:'inline' }}>
        Tell us the shot<span style={{ color:T.cyan }}>.</span>
      </Display>
      <div style={{ marginTop:20 }}>
        <CyanBtn>Get in touch →</CyanBtn>
      </div>
    </div>
  );
}

const SERVICES = [
  { num:'01', name:'LED Volumes', desc:'Walls, ceilings, processor, scaffold, rigging. Film-grade build, sized to the shot.' },
  { num:'02', name:'Driving Plates', desc:'Playback for car-on-stage — brightness, calibrated color, frame-accurate sync.' },
  { num:'03', name:'Frame Remapping', desc:'Multiple genlocked cameras, each with correct perspective. Interleaved when needed.' },
  { num:'04', name:'Server Playback', desc:'Media servers for plates, environment loops, multi-wall sync. DIT-compatible.' },
  { num:'05', name:'Specialty Lighting', desc:'Moving lights, effects fixtures, hazers, practicals. Touring-grade kit.' },
  { num:'06', name:'Turnkey Support', desc:'Crew, labour, pre-shoot consulting. One call, full delivery.' },
];

const PILLARS = [
  { name:'Checked', desc:'Bench-tested by an AV tech who\'s done it on set.' },
  { name:'Clean', desc:'Calibrated, color-checked, genlocked, gaff-taped.' },
  { name:'Labeled', desc:'Every case tagged. Every cable counted. Manifest in the truck.' },
  { name:'Reachable', desc:'The prep tech who staged your order answers at 02:00.' },
];

/* ============================================================
   DIRECTION A — "The Manifest"
   Maximum restraint. Type-only hero. Horizontal rhythm.
   The page reads like a call sheet.
   ============================================================ */
function DirectionA() {
  return <div style={{ background:T.ink, width:'100%' }}>
    <Nav />

    {/* Hero — type only on ink */}
    <div style={{ padding:'96px 24px 80px' }}>
      <Eyebrow>Cineva by Apex Sound & Light</Eyebrow>
      <Display size={56} style={{ marginTop:24 }}>
        On set.<br/>On time.<br/>On Budget<span style={{ color:T.cyan }}>.</span>
      </Display>
      <Body size={20} style={{ marginTop:24, maxWidth:480 }}>
        We're ready for our close-up. The set-facing AV arm of a 36-year production house — purpose-built for film and television.
      </Body>
      <div style={{ display:'flex', gap:12, marginTop:32 }}>
        <CyanBtn>Who we are →</CyanBtn>
        <GhostBtn>What we do</GhostBtn>
      </div>
    </div>

    {/* Services — 3×2 grid */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>What we do</Eyebrow>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:1, marginTop:24, background:T.line1 }}>
        {SERVICES.map(s => (
          <div key={s.num} style={{ padding:'24px 20px', background:T.ink }}>
            <Mono size={12} color={T.cyan}>{s.num}</Mono>
            <div style={{ fontFamily:T.archivo, fontWeight:700, fontSize:18, color:T.bone, marginTop:8, letterSpacing:'-0.01em' }}>{s.name}</div>
            <Body size={14} color={T.fog} style={{ marginTop:8 }}>{s.desc}</Body>
          </div>
        ))}
      </div>
    </div>

    {/* Pillars — 4-column with cyan top border */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>How we work</Eyebrow>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:16, marginTop:24 }}>
        {PILLARS.map((p,i) => (
          <div key={i} style={{ borderTop:`2px solid ${T.cyan}`, paddingTop:16 }}>
            <div style={{ fontFamily:T.archivo, fontWeight:700, fontSize:16, color:T.bone }}>{p.name}</div>
            <Body size={14} color={T.fog} style={{ marginTop:8 }}>{p.desc}</Body>
          </div>
        ))}
      </div>
    </div>

    <TrustedBy />
    <CTABand />
    <Footer />

    <div style={{ background:'#fff', padding:'16px 24px' }}>
      <Note>A: "The Manifest" — Maximum restraint. Type carries everything. 3×2 service grid. 4-column pillars with cyan top rule. Clean horizontal rhythm.</Note>
    </div>
  </div>;
}

/* ============================================================
   DIRECTION B — "The Prep Bay"
   Image hero with gradient protection. 2-col services
   with spec bullets. Stacked pillar list.
   ============================================================ */
function DirectionB() {
  return <div style={{ background:T.ink, width:'100%' }}>
    <Nav />

    {/* Hero — with image slot */}
    <div style={{ position:'relative', minHeight:400 }}>
      <ImageSlot label="HERO — LED VOLUME / ON-SET PHOTO" height={400} style={{ position:'absolute', inset:0, border:'none' }} />
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, #1C1D20 0%, rgba(28,29,32,0.6) 40%, rgba(28,29,32,0.3) 100%)' }}></div>
      <div style={{ position:'relative', padding:'0 24px', paddingTop:160, paddingBottom:48 }}>
        <Eyebrow>Cineva by Apex Sound & Light</Eyebrow>
        <Display size={48} style={{ marginTop:20, maxWidth:480 }}>
          On set.<br/>On time.<br/>On Budget<span style={{ color:T.cyan }}>.</span>
        </Display>
        <Body size={18} style={{ marginTop:20, maxWidth:400 }}>
          We're ready for our close-up. 36 years of AV built for film and television.
        </Body>
        <div style={{ display:'flex', gap:12, marginTop:24 }}>
          <CyanBtn>Who we are →</CyanBtn>
          <GhostBtn>What we do</GhostBtn>
        </div>
      </div>
    </div>

    {/* Services — 2-column with spec chips */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>What we do</Eyebrow>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:1, marginTop:24, background:T.line1 }}>
        {SERVICES.map(s => (
          <div key={s.num} style={{ padding:'24px 20px', background:T.ink }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
              <Mono size={13} color={T.cyan}>{s.num}</Mono>
              <div style={{ fontFamily:T.archivo, fontWeight:800, fontSize:16, color:T.bone, textTransform:'uppercase', letterSpacing:'0.02em' }}>{s.name}</div>
            </div>
            <Body size={14} color={T.fog} style={{ marginTop:10, paddingLeft:36 }}>{s.desc}</Body>
            <div style={{ marginTop:10, paddingLeft:36, display:'flex', gap:6, flexWrap:'wrap' }}>
              {['SPEC','SPEC','SPEC'].map((sp,i) => (
                <Mono key={i} size={10} color={T.iron} style={{ padding:'3px 8px', border:`1px solid ${T.line2}`, borderRadius:2, display:'inline-block' }}>{sp}</Mono>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>

    {/* Pillars — stacked list */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>How we work</Eyebrow>
      <div style={{ marginTop:24 }}>
        {PILLARS.map((p,i) => (
          <div key={i} style={{
            display:'grid', gridTemplateColumns:'32px 1fr', gap:12,
            padding:'20px 0',
            borderTop: i === 0 ? `2px solid ${T.cyan}` : `1px solid ${T.line1}`,
          }}>
            <Mono size={12} color={T.cyan}>0{i+1}</Mono>
            <div>
              <div style={{ fontFamily:T.archivo, fontWeight:700, fontSize:16, color:T.bone }}>{p.name}</div>
              <Body size={14} color={T.fog} style={{ marginTop:4 }}>{p.desc}</Body>
            </div>
          </div>
        ))}
      </div>
    </div>

    <TrustedBy />
    <CTABand />
    <Footer />

    <div style={{ background:'#fff', padding:'16px 24px' }}>
      <Note>B: "The Prep Bay" — Image hero with gradient. 2-col services with spec chips. Numbered pillar list. More visual density.</Note>
    </div>
  </div>;
}

/* ============================================================
   DIRECTION C — "The Volume"
   Oversized typographic hero. Single-column services.
   2×2 pillars. Most editorial.
   ============================================================ */
function DirectionC() {
  return <div style={{ background:T.ink, width:'100%' }}>
    <Nav />

    {/* Hero — massive type, stats column right */}
    <div style={{ padding:'80px 24px 64px', position:'relative', overflow:'hidden' }}>
      <Eyebrow>Cineva by Apex Sound & Light</Eyebrow>
      <div style={{ display:'grid', gridTemplateColumns:'1fr auto', gap:48, marginTop:28, alignItems:'end' }}>
        <div>
          <Display size={68} style={{ lineHeight:0.88, letterSpacing:'-0.03em' }}>
            On set<span style={{ color:T.cyan }}>.</span><br/>
            On time<span style={{ color:T.cyan }}>.</span><br/>
            On Budget<span style={{ color:T.cyan }}>.</span>
          </Display>
          <Body size={18} style={{ marginTop:28, maxWidth:420 }}>
            We're ready for our close-up. The set-facing AV arm of a 36-year production house — purpose-built for film and television.
          </Body>
          <div style={{ display:'flex', gap:12, marginTop:28 }}>
            <CyanBtn>Who we are →</CyanBtn>
            <GhostBtn>What we do</GhostBtn>
          </div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:16, paddingBottom:8 }}>
          {[['36','YEARS'],['6','SERVICE LINES'],['24/7','ON-SET SUPPORT'],['YYZ','PICKERING, ON']].map(([val,label],i) => (
            <div key={i} style={{ textAlign:'right' }}>
              <div style={{ fontFamily:T.archivo, fontWeight:800, fontSize:28, color:T.bone, letterSpacing:'-0.02em' }}>{val}</div>
              <Mono size={10} color={T.iron}>{label}</Mono>
            </div>
          ))}
        </div>
      </div>
    </div>

    {/* Services — single column, large type, right-aligned arrows */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>What we do</Eyebrow>
      <div style={{ marginTop:24 }}>
        {SERVICES.map((s,i) => (
          <div key={s.num} style={{
            display:'grid', gridTemplateColumns:'40px 1fr auto', gap:16, alignItems:'baseline',
            padding:'20px 0',
            borderBottom: `1px solid ${T.line1}`,
          }}>
            <Mono size={13} color={T.cyan}>{s.num}</Mono>
            <div>
              <div style={{ fontFamily:T.archivo, fontWeight:800, fontSize:22, color:T.bone, letterSpacing:'-0.01em' }}>{s.name}</div>
              <Body size={14} color={T.fog} style={{ marginTop:6 }}>{s.desc}</Body>
            </div>
            <span style={{ fontFamily:T.archivo, fontSize:18, color:T.iron }}>→</span>
          </div>
        ))}
      </div>
    </div>

    {/* Pillars — 2×2 grid */}
    <div style={{ padding:'64px 24px', borderTop:`1px solid ${T.line1}` }}>
      <Eyebrow>How we work</Eyebrow>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:1, marginTop:24, background:T.line1 }}>
        {PILLARS.map((p,i) => (
          <div key={i} style={{ padding:'24px 20px', background:T.ink }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:6, height:6, background:T.cyan, borderRadius:1 }}></div>
              <div style={{ fontFamily:T.archivo, fontWeight:700, fontSize:18, color:T.bone }}>{p.name}</div>
            </div>
            <Body size={14} color={T.fog} style={{ marginTop:8, paddingLeft:16 }}>{p.desc}</Body>
          </div>
        ))}
      </div>
    </div>

    <TrustedBy />
    <CTABand />
    <Footer />

    <div style={{ background:'#fff', padding:'16px 24px' }}>
      <Note>C: "The Volume" — Oversized type hero with stats sidebar. Single-column service list. 2×2 pillars. Most editorial, most confident.</Note>
    </div>
  </div>;
}

/* ============================================================
   Canvas
   ============================================================ */
function App() {
  return (
    <DesignCanvas title="Cineva Homepage — 3 Directions" subtitle="All using exact brand tokens. Pick a direction or mix elements.">
      <DCSection id="directions" title="Layout Directions">
        <DCArtboard id="a-manifest" label='A: "The Manifest"' width={1024} height={1520}>
          <DirectionA />
        </DCArtboard>
        <DCArtboard id="b-prepbay" label='B: "The Prep Bay"' width={1024} height={1620}>
          <DirectionB />
        </DCArtboard>
        <DCArtboard id="c-volume" label='C: "The Volume"' width={1024} height={1580}>
          <DirectionC />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
